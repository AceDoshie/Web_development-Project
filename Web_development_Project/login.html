<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Endurance Hub</title>
  <link rel="stylesheet" href="Web_development.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 2rem 3rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      color: #fff;
      text-align: center;
      animation: fadeIn 0.7s ease-in-out;
    }

    .login-card h1 {
      margin-bottom: 1.5rem;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    .login-card input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .login-card input:focus {
      outline: 2px solid #64ffda;
    }

    .login-card button {
      margin-top: 1rem;
      padding: 0.8rem;
      width: 100%;
      background: #64ffda;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-card button:hover {
      background: #1de9b6;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Login to Your Account</h1>
    <form onsubmit="handleLogin(event)">
      <input type="text" id="loginUsername" placeholder="Username" required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();

      const usernameInput = document.getElementById("loginUsername").value;
      const passwordInput = document.getElementById("loginPassword").value;

      const accounts = JSON.parse(localStorage.getItem("accounts")) || [];
      const matchedAccount = accounts.find(acc => acc.username === usernameInput && acc.password === passwordInput);

      if (matchedAccount) {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("username", matchedAccount.username);
        localStorage.setItem("accountPassword", matchedAccount.password);
        localStorage.setItem("account", JSON.stringify(matchedAccount));
        alert("Login successful!");
        window.location.href = "Index.html";
      } else {
        alert("Invalid username or password.");
      }
    }
  </script>
</body>
</html>
