<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Endurance Hub</title>
  <link rel="stylesheet" href="Web_development.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .signup-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 2rem 3rem;
      width: 95%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      color: #fff;
      animation: fadeIn 0.7s ease-in-out;
    }

    .signup-card h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    .signup-card input,
    .signup-card select {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .signup-card input:focus,
    .signup-card select:focus {
      outline: 2px solid #64ffda;
    }

    .signup-card button {
      margin-top: 1rem;
      padding: 0.8rem;
      width: 100%;
      background: #64ffda;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .signup-card button:hover {
      background: #1de9b6;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="signup-card">
    <h1>Create Your Account</h1>
    <form onsubmit="handleSignup(event)">
      <input type="text" id="fullname" placeholder="Full Name" required />
      <input type="text" id="username" placeholder="Username" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="password" id="password" placeholder="Password" required />
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
      <input type="date" id="birthdate" required />
      <select id="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Prefer not to say</option>
      </select>
      <button type="submit">Sign Up</button>
    </form>
  </div>

  <script>
    function handleSignup(event) {
      event.preventDefault();

      const fullname = document.getElementById('fullname').value;
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const birthdate = document.getElementById('birthdate').value;
      const gender = document.getElementById('gender').value;

      if (username === password) {
        alert("Username and password cannot be the same.");
        return;
      }

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      const birthDateObj = new Date(birthdate);
      const today = new Date();
      const age = today.getFullYear() - birthDateObj.getFullYear();
      const monthDiff = today.getMonth() - birthDateObj.getMonth();
      const dayDiff = today.getDate() - birthDateObj.getDate();
      const isOldEnough = (age > 15) || (age === 15 && (monthDiff > 0 || (monthDiff === 0 && dayDiff >= 0)));

      if (!isOldEnough) {
        alert("You must be at least 15 years old to create an account.");
        return;
      }

      let accounts = JSON.parse(localStorage.getItem("accounts")) || [];

      const usernameExists = accounts.some(acc => acc.username === username);
      if (usernameExists) {
        alert("Username already exists. Please choose another one.");
        return;
      }

      accounts.push({
        fullname,
        username,
        email,
        gender,
        birthdate,
        password
      });

      localStorage.setItem("accounts", JSON.stringify(accounts));
      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("username", username);
      localStorage.setItem("accountPassword", password);

      alert("Account created successfully!");
      window.location.href = "Index.html";
    }
  </script>
</body>
</html>
